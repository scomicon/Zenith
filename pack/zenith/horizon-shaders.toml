# Zenith - a Horizon shader pack (shader API 0.2, schema 1, MIT license).
# Written clean-room from published rendering literature; see PROVENANCE.md.
# `horizon-shader check` validates every file named in this manifest.

schema = 1
id = "zenith"
name = "Zenith"
version = "0.2.0"
api = "0.2"
description = "Physically-minded shader pack: shadows, GTAO, volumetric light, bloom, own sky and tone curve."
license = "MIT"
shared = ["shared/common.wgsl", "shared/fog.wgsl"]

[frame]
# Linear blending: glass, water and clouds blend as light does (the stages see the same values either way).
blend = "linear"
primaries = "bt709"
fog = "pack" # Requires 3a6bea5: retain surface detail farther under water.

[budget]
gpu_ms = 4.0

# ---------------------------------------------------------------- stages (tables merged from manifest-fragments/sky.toml and material.toml)

[sky]
file = "sky/sky.wgsl"
files = ["sky/clouds.wgsl"]
reads = ["zp_clouds"]
clouds = false # Zenith ray-marched layer replaces vanilla clouds.
sun = false
stars = false
# Horizon 0.2: sun = false leaves vanilla's moon enabled (there is no moon key); the analytic lunar
# disc/halo sits underneath the engine moon and its phases.

[weather]
file = "weather/weather.wgsl"
# API 0.2 weather stage lights/fogs engine rain/snow geometry, not world fog.

[tonemap]
file = "tonemap/tonemap.wgsl"

[material]
file = "material/material.wgsl"
reads = ["zp_climate"]
files = [
    "material/common_local.wgsl",
    "material/shadows.wgsl",
    "material/finishes.wgsl",
    "material/pbr.wgsl",
    "material/lighting.wgsl",
    "material/water.wgsl",
]
# Coverage stays the engine's: no stage of this pack calls `discard`, so solid and cutout terrain keep
# Horizon's alpha test on the texture's alpha and translucent terrain keeps its returned alpha as opacity.
# Switch to "pack" only if a material starts cutting its own holes (the check refuses `discard` under "engine").
coverage = "engine"

[entity]
file = "entity/entity.wgsl"
# Same rule as [material]: Horizon keeps each entity's coverage (texture alpha x layer opacity, cut below 0.1);
# entity.wgsl neither discards nor fades entities itself.
coverage = "engine"

[vertex]
file = "vertex/vertex.wgsl"

[shadow]
resolution = 2048
distance = 128.0
solid_materials = [10]
option = "shadows_enabled"
resolution_option = "shadow_resolution"
distance_option = "shadow_distance"

[reflection]
option = "water_reflections"

[displacement]
distance = 14.0
cells = 16
option = "pbr_displacement"
cells_option = "displacement_cells"


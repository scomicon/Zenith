# ---------------------------------------------------------------------------
# User Options (mapped to WGSL overrides and [shadow] sizing)
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------- post chain
# `previous` stays the world's picture through every pass that has an `output`;
# "compose" is the first pass that advances it, followed by "end_rift" before bloom.

[[resource]]
name = "ao"
format = "rgba16float"
size = [960, 540]
keep = "view"

[[resource]]
name = "zp_hiz"
format = "r32float"
size = [480, 270]
keep = "view"

[[resource]]
name = "zp_luma_tiles"
format = "rgba32uint"
size = [64, 96]
keep = "view"

# Exposure (element 0) and the three lens-flare sources (1-3) share one small buffer.
[[resource]]
name = "zp_shared"
buffer = 64
element = "vec4<f32>"
keep = "view"

[[resource]]
name = "vlight"
format = "rgba16float"
size = [960, 540]
keep = "view"

[[resource]]
name = "zp_reflection"
format = "rgba16float"
scale = 1
keep = "view"

# Cloud layer baked by a [[before_world]] pass and read by the sky: its top-left half-size corner, the whole of it in Ultra.
[[resource]]
name = "zp_clouds"
format = "r32uint"
scale = 1
keep = "view"

[[resource]]
name = "zp_climate"
format = "rgba16float"
size = [64, 33]
keep = "view"

[[before_world]]
file = "compute/sky_lut.wgsl"
name = "Sky LUT & biome climate"
dispatch = [64, 33, 1]
workgroup = [8, 8, 1]
reads = ["zp_climate_previous"]
writes = ["zp_climate"]

[[before_world]]
file = "compute/cloud_bake.wgsl"
files = ["sky/clouds.wgsl"]
name = "Cloud layer"
dispatch = [960, 540, 1]
workgroup = [8, 8, 1]
writes = ["zp_clouds"]

[[post]]
file = "post/gtao.wgsl"
name = "GTAO"
output = "ao"
reads = ["ao_previous"]

[[post]]
file = "post/volumetric.wgsl"
files = ["post/reprojection.wgsl"]
name = "Volumetric light"
output = "vlight"
reads = ["vlight_previous"]

[[post]]
file = "post/compose.wgsl"
name = "Compose AO + light"
reads = ["ao", "vlight", "zp_climate"]

[[post]]
file = "post/hiz.wgsl"
name = "Hi-Z depth"
compute = true
dispatch = [480, 270, 1]
workgroup = [8, 8, 1]
writes = ["zp_hiz"]

[[post]]
file = "post/ssr.wgsl"
files = ["post/reprojection.wgsl"]
name = "Reflections"
output = "zp_reflection"
reads = ["zp_reflection_previous", "zp_hiz"]

[[post]]
file = "post/end_rift.wgsl"
files = ["shared/rift_source.wgsl", "post/sss_screen.wgsl"]
name = "End warp rift and subsurface scattering"
reads = ["zp_reflection"]

[[post]]
file = "compute/exposure_histogram.wgsl"
name = "Luminance histogram"
compute = true
dispatch = [768, 8, 1]
workgroup = [64, 1, 1]
writes = ["zp_luma_tiles"]

[[post]]
file = "compute/exposure_resolve.wgsl"
name = "Exposure adaptation"
compute = true
dispatch = [64, 1, 1]
workgroup = [64, 1, 1]
reads = ["zp_luma_tiles"]
writes = ["zp_shared"]

[[post]]
file = "post/bloom_down_a.wgsl"
name = "Bloom 1/2"
output = "bloom_a"
scale = 0.5

[[post]]
file = "post/bloom_down_b.wgsl"
name = "Bloom 1/4"
output = "bloom_b"
scale = 0.25

[[post]]
file = "post/bloom_wide.wgsl"
name = "Bloom wide"
output = "bloom_wide"
scale = 0.25

[[post]]
file = "post/smaa_edges.wgsl"
name = "Morphological edges"
output = "zp_edges"

[[post]]
file = "post/smaa_weights.wgsl"
name = "Morphological weights"
output = "zp_edge_weights"

[[post]]
file = "post/fxaa.wgsl"
name = "Anti-aliasing"

[[post]]
file = "compute/optics_sources.wgsl"
files = ["shared/rift_source.wgsl"]
name = "Optical light sources"
compute = true
dispatch = [64, 1, 1]
workgroup = [64, 1, 1]
writes = ["zp_shared"]

[[post]]
file = "post/grade.wgsl"
files = ["post/reprojection.wgsl", "post/optics.wgsl"]
name = "Bloom + colour grade"
reads = ["zp_shared"]

# ---------------------------------------------------------------- options
# Each id is the `override` of the same name in some stage (post/*, sky, tonemap, material/*, entity, vertex),
# except shadows_enabled / shadow_resolution / shadow_distance, which [shadow] reads.

[[options]]
id = "quality_mode"
name = "Quality mode"
description = "Performance: fewer AO and light-shaft samples. Balanced: default. Quality: more samples, cleaner shadows in creases and shafts. Ultra: the most samples everywhere and full-resolution clouds, whatever the cost; pair it with 8192 shadows."
type = "choice"
values = ["Performance", "Balanced", "Quality", "Ultra"]
default = "Balanced"

[[options]]
id = "volumetric_light"
name = "Volumetric light"
type = "float"
default = 0.6
min = 0.0
max = 3.0
step = 0.1
description = "Strength of sunlight scattered in the haze: light shafts and the glow around a low sun. 0 turns them off. Needs shadows."
resets = "view"

[[options]]
id = "ssr_enabled"
name = "Surface Reflections (SSR)"
description = "Screen-space reflections of light sources and terrain on metals, gems, polished blocks, and rain puddles."
type = "bool"
default = true
resets = "view"

[[options]]
id = "ssr_glossy"
name = "Glossy Reflections"
description = "Roughness-aware reflection cone with contact-hardening blur, so semi-rough metals and wet blocks reflect softly. Needs SSR."
type = "bool"
default = true
resets = "view"

[[options]]
id = "temporal_ssr"
name = "Temporal Reflections"
description = "Experimental history for reflections of solid terrain on stable surfaces."
type = "bool"
default = false
resets = "view"

[[options]]
id = "temporal_light"
name = "Temporal Light Shafts"
description = "Experimental history for volumetric light in front of solid terrain."
type = "bool"
default = false
resets = "view"

[[options]]
id = "ao_strength"
name = "Ambient occlusion"
type = "float"
default = 1.0
min = 0.0
max = 1.5
step = 0.05
description = "How dark creases and corners get. 0 turns it off."
resets = "view"

[[options]]
id = "temporal_ao"
name = "Temporal Ambient Occlusion"
type = "bool"
default = false
resets = "view"
description = "Blend ambient occlusion across frames on stable terrain. Experimental."

[[options]]
id = "bloom"
name = "Bloom"
type = "float"
default = 1.0
min = 0.0
max = 3.0
step = 0.1
description = "Glow around bright light. 0 turns it off."

[[options]]
id = "fxaa"
name = "Edge smoothing"
type = "bool"
default = true
description = "Enable spatial anti-aliasing. Uses FXAA unless Morphological AA is enabled."

[[options]]
id = "morphological_aa"
name = "Morphological AA (Experimental)"
type = "bool"
default = false
description = "Use a spatial SMAA-inspired filter instead of FXAA. Edge smoothing must be enabled."

[[options]]
id = "saturation"
name = "Saturation"
type = "float"
default = 1.05
min = 0.0
max = 2.0
step = 0.05
description = "How colourful the picture is."

[[options]]
id = "color_mood"

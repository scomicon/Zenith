[[options]]
id = "histogram_exposure"
name = "Meter Exposure from Image"
description = "Measure actual HDR scene brightness. Off uses the older eye-light metering while auto exposure is enabled."
type = "bool"
default = true
resets = "view"

[[options]]
id = "exposure_bias"
name = "Exposure (EV)"
type = "float"
default = 0.0
min = -4.0
max = 4.0
step = 0.25

[[options]]
id = "tonemap_curve"
name = "Tone curve"
type = "choice"
values = ["Soft", "Neutral", "Contrast", "AgX"]
default = "AgX"

[[options]]
id = "shadows_enabled"
name = "Real-Time Shadows"
description = "Cast real-time sun and moon shadows across terrain and entities."
type = "bool"
default = true

[[options]]
id = "engine_shadows"
name = "Zenith Engine Shadows"
description = "Needs the Zenith Engine mod. The mod casts sun shadows within about 100 blocks by tracing its own voxel copy of the world, and the pack stops shadowing that range so nothing is darkened twice. Farther away the pack's shadows return. Without the mod, nearby terrain gets no sun shadows."
type = "bool"
default = false

[[options]]
id = "shadow_resolution"
name = "Shadow Resolution"
description = "Resolution of the shadow map in texels."
type = "choice"
values = ["1024", "2048", "4096", "8192"]
default = "2048"

[[options]]
id = "shadow_distance"
name = "Shadow Distance"
description = "Half-width of the area covered by the shadow map, in blocks."
type = "choice"
values = ["64", "96", "128", "192", "256", "384", "512"]
default = "128"

[[options]]
id = "shadow_filter_quality"
name = "Shadow Filter Quality"
description = "Number of PCF taps per pixel for shadow penumbra smoothing."
type = "choice"
values = ["Low", "Medium", "High"]
default = "Medium"

[[options]]
id = "shadow_softness"
name = "Shadow Softness"
description = "Filter radius in shadow texels."
type = "float"
default = 1.35
min = 0.25
max = 3.5
step = 0.05

[[options]]
id = "colored_shadows"
name = "Colored Translucent Shadows"
description = "Tint sunlight passing through stained glass and simulate water caustics."
type = "bool"
default = true

[[options]]
id = "shadow_pcss"
name = "Variable Shadow Softness (PCSS)"
description = "Keep shadows crisp at contact points and soften them naturally with caster distance."
type = "bool"
default = true

[[options]]
id = "cloud_shadows"
name = "Cloud Shadows"
description = "Project soft drifting shadows from overhead clouds onto terrain and entities."
type = "bool"
default = true

[[options]]
id = "contact_shadows"
name = "Screen-Space Contact Shadows"
description = "Fill tiny shadow-bias leaks at the base of grass, fences, stairs, and block corners."
type = "bool"
default = true

[[options]]
id = "block_light_strength"
name = "Block Light Intensity"
description = "Brightness of torches, lanterns, and colored block light sources."
type = "float"
default = 1.15
min = 0.2
max = 2.5
step = 0.05

[[options]]
id = "ambient_strength"
name = "Sky Ambient Intensity"
description = "Strength of indirect sky and hemisphere bounce lighting."
type = "float"
default = 1.0
min = 0.4
max = 2.0
step = 0.05

[[options]]
id = "emissive_strength"
name = "Emissive Glow"
description = "Intensity of glowing blocks, lava, and emissive entity eyes."
type = "float"
default = 1.4
min = 0.2
max = 3.0
step = 0.1

[[options]]
id = "ore_glow"
name = "Glowing Ores & Magma"
description = "Selectively illuminate bright mineral veins on ore blocks."
type = "bool"
default = true

[[options]]
id = "pbr_specular"
name = "PBR Specular & Normals"
description = "Enable GGX specular highlights and LabPBR normal/specular resource pack support."
type = "bool"
default = true

[[options]]
id = "procedural_pbr"
name = "Procedural Block Relief"
description = "Generate micro-normals, crevice AO, and roughness detail from vanilla block textures when no LabPBR pack is active."
type = "bool"
default = true

[[options]]
id = "pbr_pom"
name = "Parallax Occlusion Mapping (POM)"
description = "Trace depth and self-shadows from LabPBR height maps. Vanilla sprites retain procedural micro-relief and their original texture filtering."
type = "bool"
default = true

[[options]]
id = "pom_depth"
name = "Relief Depth (POM / Displacement)"
description = "Maximum physical depth of block relief and crevices, in blocks."
type = "float"
default = 0.06
min = 0.02
max = 0.15
step = 0.01

[[options]]
id = "pbr_displacement"
name = "Geometry Displacement (LabPBR)"
description = "Subdivide and physically displace nearby solid faces when a LabPBR pack with height maps is active."
type = "bool"
default = true

[[options]]
id = "displacement_cells"
name = "Displacement Grid Density"
description = "Subdivision cells per block face for LabPBR geometry displacement."
type = "choice"
values = ["8", "16", "32"]
default = "16"

[[options]]
id = "rain_wetness"
name = "Rain Wetness & Puddles"
description = "Wet blocks and exposed entities during rain, with reflective terrain puddles and gradual drying."
type = "bool"
default = true

[[options]]
id = "foliage_sss"
name = "Foliage Subsurface Scattering"
description = "Allow sunlight to softly transmit through leaves and plants."
type = "bool"
default = true

[[options]]
id = "body_sss"
name = "Body Subsurface Scattering"
description = "Soft light bleeding, back transmission and screen-space diffusion on skin, wax, snow, ice and other LabPBR subsurface materials."
type = "bool"
default = true

[[options]]
id = "snow_sand_sparkle"
name = "Snow & Sand Sparkle"
description = "Add subtle sunlight crystal glints on snow and sand."
type = "bool"
default = true

[[options]]
id = "water_reflections"
name = "Water Mirror Reflections"
description = "Reflect terrain and sky on water surfaces using Horizon's planar mirror (in Zenith RT also traced rays). Turn it off to let the Zenith Engine mod reflect the water instead."
type = "bool"
default = true

[[options]]
id = "water_wave_strength"
name = "Water Wave Strength"
description = "Height of procedural normal-mapped ripples on water."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "water_absorption"
name = "Water Depth Absorption"
description = "Controls how quickly water transitions from clear shallows to deep tint."
type = "float"
default = 1.0
min = 0.2
max = 2.5
step = 0.05

[[options]]
id = "underwater_clarity"
name = "Underwater clarity"
type = "float"
default = 1.8
min = 1.0
max = 3.0
step = 0.1
description = "How far terrain and plants stay visible under water. Higher values give clearer water."

[[options]]
id = "water_foam"
name = "Shoreline Foam"
description = "Render soft animated foam where shallow water meets terrain."
type = "bool"
default = true

[[options]]
id = "water_refraction"
name = "Water Refraction"
description = "Refract submerged terrain and entities through animated water waves using true spectral absorption."
type = "bool"
default = true

[[options]]
id = "glass_refraction"
name = "Glass & Ice Refraction"
description = "Apply subtle optical refraction and spectral colored transmission through stained glass and translucent ice."
type = "bool"
default = true

[[options]]
id = "waving_foliage"
name = "Waving Foliage"
description = "Animate grass, flowers, crops, vines, and leaves in the wind."
type = "bool"
default = true

[[options]]
id = "waving_water"
name = "Waving Water"
description = "Gently displace water surface vertices with waves."
type = "bool"
default = true

[[options]]
id = "wind_strength"
name = "Wind Strength"
description = "Global amplitude multiplier for vertex wind animation."
type = "float"
default = 1.0
min = 0.0
max = 2.5
step = 0.05

[[options]]
id = "end_rift"
name = "End Warp Rift"
description = "Animated 3D volumetric warp rift in The End sky."
type = "bool"
default = true

[[options]]

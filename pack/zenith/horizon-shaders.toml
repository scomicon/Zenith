type = "float"
default = 0.0
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "clouds"
name = "Clouds"
description = "Ray-marched clouds."
type = "bool"
default = true

[[options]]
id = "cloud_coverage"
name = "Cloud coverage"
type = "float"
default = 0.48
min = 0.0
max = 1.0
step = 0.02

[[options]]
id = "sky_saturation"
name = "Sky saturation"
type = "float"
default = 1.0
min = 0.0
max = 1.6
step = 0.05

[[options]]
id = "cirrus_clouds"
name = "High Cirrus Clouds"
description = "Wispy high-altitude ice-crystal clouds above the main cumulus layer."
type = "bool"
default = true

[[options]]
id = "aurora"
name = "Night Aurora & Milky Way"
description = "Render the galactic Milky Way band and subtle boreal aurora curtains at night."
type = "bool"
default = true

[[options]]
id = "atmospheric_fog"
name = "Height Fog & Aerial Perspective"
description = "Density of the haze, valley fog and aerial perspective (distant terrain and the horizon), dawn mist over water and outdoor biome lighting. 0 turns them off."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "auto_exposure"
name = "Auto Exposure (Eye Adaptation)"
description = "Smoothly adapt exposure between bright and dark views. Off keeps only the manual EV setting."
type = "bool"
default = true

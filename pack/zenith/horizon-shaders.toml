default = 0.0
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "depth_of_field"
name = "Depth of Field"
description = "Soften surfaces away from the focus plane. 0 turns it off."
type = "float"
default = 0.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "focus_distance"
name = "Focus Distance (Blocks)"
